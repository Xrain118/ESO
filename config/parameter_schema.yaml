schema_version: 1
runtime:
  mode:
    type: integer
    allowed: [0, 1, 2, 3]
    default: 0
  enable_control_output:
    type: boolean
    default: false
  status_rate_hz:
    type: number
    minimum: 1.0
    maximum: 100.0
    default: 50.0
  state_timeout_ms:
    type: integer
    minimum: 20
    maximum: 1000
    default: 200
  allocator_timeout_ms:
    type: integer
    minimum: 20
    maximum: 1000
    default: 250
